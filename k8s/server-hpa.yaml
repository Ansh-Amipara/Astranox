apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: astranox-server-hpa
  namespace: astranox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: astranox-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
