version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: astranox-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15-alpine
    container_name: astranox-db
    environment:
      POSTGRES_USER: astranox
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: astranox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astranox"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: astranox-server
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://astranox:password123@db:5432/astranox?schema=public
      - JWT_SECRET=astranox_super_secret_jwt_key_123!
      - CLIENT_URL=http://localhost:5174
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: astranox-client
    ports:
      - "5174:80"
    depends_on:
      - server

  mongo-backup:
    profiles: ["backup"]
    image: mongo:7.0
    container_name: astranox-mongo-backup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Creating local MongoDB backup archive..."
        mkdir -p /backups
        TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
        mongodump --uri="$$DATABASE_URL" --archive="/backups/astranox_local_$${TIMESTAMP}.gz" --gzip
        echo "Local backup completed: /backups/astranox_local_$${TIMESTAMP}.gz"
    environment:
      - DATABASE_URL=${DATABASE_URL:-mongodb://localhost:27017/astranox?replicaSet=rs0}
    volumes:
      - ./backups:/backups

volumes:
  postgres_data:
  redis_data:
